name: Déployer le dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier le projet
        run: node scripts/check.mjs

      - name: Écrire config.js à partir des variables du dépôt
        env:
          HEYEM_API_URL: ${{ vars.HEYEM_API_URL }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
        run: node scripts/write-config.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
