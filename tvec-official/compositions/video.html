/* ================= TRANSITION « SLASH » ================= */
function slash(t,t0,dir){const s=$('#slash'),d=.2,p=P(t,t0-d,t0+d);if(p<=0||p>=1){s.style.display='none';return}
 s.style.display='block';const a=E.inout(P(t,t0-d,t0)),b=E.inout(P(t,t0,t0+d));
 const x=a<1?lerp(-1900*dir,0,a):lerp(0,1900*dir,b);
 s.style.background='linear-gradient(100deg,transparent 0 6%,#fff 6% 9%,var(--v) 9% 90%,#fff 90% 93%,transparent 93%)';

function which(t){return t<4?'a':t<7.5?'b':t<11?'b2':t<14?'c1':t<16.8?'c2':t<19?'c3':t<28?'d':'e'}
function seek(t){
  const w=which(t);Object.keys(sc).forEach(k=>sc[k].style.display=k===w?'block':'none');
  el.hdr.style.display=(t>=11&&t<28)?'block':'none';
  // caméra : impacts + dérive
  const hits=[0,.5,1,1.5,4,7.5,9.5,11,12,13,16.8,19,21,23,25,28,30.25];let dx=0,dy=0;hits.forEach(h=>{const q=sh(t,h,h===28?26:13);dx+=q[0];dy+=q[1]});
  cam.style.transform=`translate(${dx}px,${dy}px) scale(${1+.02*Math.sin(t*.4)})`;
  $('#grain').style.transform=`translate(${(Math.sin(t*91)*40)|0}px,${(Math.cos(t*77)*40)|0}px)`;
  // flashs
  let f=0,fw=0;[[0,.3,.95],[1.5,.2,.9],[4,.16,.6],[11,.14,.5],[28,.22,.9]].forEach(([a,d,k])=>{const p=P(t,a,a+d);if(p>0&&p<1)f=Math.max(f,k*(1-p))});
  [[.0,.06,.9],[28,.07,.8]].forEach(([a,d,k])=>{const p=P(t,a,a+d);if(p>0&&p<1)fw=Math.max(fw,k*(1-p))});
  $('#flash').style.opacity=f;$('#flashw').style.opacity=fw;
  ({a:SA,b:SB,b2:SB2,c1:SC1,c2:SC2,c3:SC3,d:SD,e:SE})[w](t);
  const act=[[4,1],[11,-1],[19,1]].find(([a])=>Math.abs(t-a)<.2);
  if(act)slash(t,act[0],act[1]);else $('#slash').style.display='none';
}
